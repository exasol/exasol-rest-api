name: Dependencies Check

on:
  schedule:
    - cron: "0 23 * * *"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.1"

      - name: Nancy Security scanner
        run: |
          go list -json -deps | docker run \
             --env OSSI_USERNAME=${{ secrets.OSSINDEX_USERNAME }} \
             --env OSSI_TOKEN=${{ secrets.OSSINDEX_API_TOKEN }} \
             --rm -i sonatypecommunity/nancy:latest sleuth \
             --skip-update-check

      - name: Check for Go vulnerabilities
        if: always()
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -version
          govulncheck -format text -mode source -scan symbol -show verbose -test ./...
